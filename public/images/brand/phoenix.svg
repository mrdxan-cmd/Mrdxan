      <stop offset="0.78" stop-color="#ffa06a"/>
      <stop offset="1" stop-color="#ffe0a8"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="1" stop-color="#fff1cc"/>
